# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TC_CLOUD_TOKEN: ${{ secrets.TC_CLOUD_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    # Testcontainers Cloud is optional: secrets are not available on Dependabot/fork PRs,
    # in that case the tests use the Docker engine of the GitHub-hosted runner.
    - name: Setup Testcontainers Cloud Client
      if: ${{ env.TC_CLOUD_TOKEN != '' }}
      uses: atomicjar/testcontainers-cloud-setup-action@v1
      with:
        token: ${{ env.TC_CLOUD_TOKEN }}

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Upload test reports
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: build/reports/tests/
        retention-days: 7

  dependency-submission:

    # Submitting the dependency graph needs write access, which is only granted on push to main.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
